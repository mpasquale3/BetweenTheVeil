<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Between the Veil horizontal logo</title>
  <desc id="desc">Horizontal wordmark for Between the Veil with a thin arched doorway and gold accent.</desc>

  <rect width="1400" height="320" fill="none"/>

  <!-- Wordmark -->
  <g fill="#F1E8DB"
     font-family="Cormorant Garamond, Georgia, serif"
     font-weight="500">
    <text x="70" y="155" font-size="92" letter-spacing="10">BETWEEN THE VEIL</text>
  </g>

  <!-- Gold underline -->
  <line x1="72" y1="190" x2="1210" y2="190"
        stroke="#B99B67" stroke-width="3"/>

  <!-- Arch -->
  <path
    d="M 1210 190
       L 1210 128
       A 60 60 0 0 1 1330 128
       L 1330 190"
    fill="none"
    stroke="#F1E8DB"
    stroke-width="6"
    stroke-linecap="square"
  />

  <!-- Gold diamond inside arch -->
  <polygon
    points="1270,145 1282,157 1270,169 1258,157"
    fill="#B99B67"
  />

  <!-- Descriptor -->
  <text
    x="70"
    y="245"
    fill="#F1E8DB"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    letter-spacing="12"
  >AN INDEPENDENT BOOKSHOP</text>
</svg>
