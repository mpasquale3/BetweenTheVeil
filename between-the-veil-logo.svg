<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Between the Veil logo</title>
  <desc id="desc">Editorial bookstore logo with an arched doorway and the words Between the Veil.</desc>
  <view id="wordmark" viewBox="180 190 840 500" />

  <!-- Arch -->
  <path
    d="M 430 650
       L 430 300
       A 170 170 0 0 1 770 300
       L 770 650"
    fill="none"
    stroke="#F1E8DB"
    stroke-width="8"
    stroke-linecap="square"
  />

  <!-- Wordmark -->
  <g
    fill="#F1E8DB"
    font-family="Cormorant Garamond, Georgia, serif"
    font-weight="500"
  >
    <text x="235" y="360" font-size="82" letter-spacing="14">BETWEEN</text>
    <text x="485" y="470" font-size="78" letter-spacing="10">THE</text>
    <text x="640" y="585" font-size="82" letter-spacing="14">VEIL</text>
  </g>

  <!-- Descriptor -->
  <g fill="#B99B67">
    <line x1="360" y1="730" x2="530" y2="730" stroke="#B99B67" stroke-width="3"/>
    <polygon points="600,718 612,730 600,742 588,730"/>
    <line x1="670" y1="730" x2="840" y2="730" stroke="#B99B67" stroke-width="3"/>
  </g>

  <text
    x="600"
    y="795"
    text-anchor="middle"
    fill="#F1E8DB"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    letter-spacing="12"
  >AN INDEPENDENT BOOKSHOP</text>
</svg>
